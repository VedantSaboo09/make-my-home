<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Make My Home | Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f8f5f0;
      color: #222;
      padding: 25px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #777;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    #adminPanel {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Make My Home</h1>


  <!-- LOGIN -->

  <div class="card" id="loginPanel">

    <h2>Admin Login</h2>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <div class="message" id="loginMessage"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div class="card" id="adminPanel">

    <h2>Add Product</h2>

    <label>Product Name</label>

    <input
      type="text"
      id="productName"
      placeholder="Example: Beautiful Bed Cover"
    >


    <label>Price</label>

    <input
      type="number"
      id="productPrice"
      placeholder="Example: 4715"
    >


    <label>Description</label>

    <textarea
      id="productDescription"
      placeholder="Enter product description"
    ></textarea>


    <label>Category</label>

    <select id="productCategory">

      <option value="bedcovers">
        Bed Covers
      </option>

      <option value="comforters">
        Comforters
      </option>

      <option value="bedsheets">
        Bedsheets
      </option>

      <option value="curtains">
        Curtains
      </option>

      <option value="cushioncovers">
        Cushion Covers
      </option>

      <option value="homedecor">
        Home Decor
      </option>

    </select>


    <label>Image URL</label>

    <input
      type="text"
      id="imageUrl"
      placeholder="Paste image URL"
    >


    <button onclick="addProduct()">
      Add Product
    </button>

    <button class="logout" onclick="logout()">
      Logout
    </button>

    <div class="message" id="productMessage"></div>

  </div>

</div>


<script>

  /* SUPABASE */

  const SUPABASE_URL = "https://osnzonmcobilkeetwwpf.supabase.co/rest/v1/";

  const SUPABASE_KEY = "sb_publishable_rdOm4RUqAnNfUreHLikodA_77SN8wwj";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* LOGIN */

  async function login() {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      document.getElementById("loginMessage").textContent =
        error.message;

      return;
    }


    showAdminPanel();

  }


  /* SHOW ADMIN */

  function showAdminPanel() {

    document.getElementById("loginPanel").style.display =
      "none";

    document.getElementById("adminPanel").style.display =
      "block";

  }


  /* ADD PRODUCT */

  async function addProduct() {

    const name =
      document.getElementById("productName").value;

    const price =
      document.getElementById("productPrice").value;

    const description =
      document.getElementById("productDescription").value;

    const category =
      document.getElementById("productCategory").value;

    const imageUrl =
      document.getElementById("imageUrl").value;


    if (
      !name ||
      !price ||
      !description ||
      !category ||
      !imageUrl
    ) {

      document.getElementById("productMessage").textContent =
        "Please fill all fields.";

      return;
    }


    const { error } =
      await supabaseClient
        .from("products")
        .insert([
          {
            name: name,
            price: Number(price),
            description: description,
            category: category,
            image_url: imageUrl
          }
        ]);


    if (error) {

      document.getElementById("productMessage").textContent =
        "Error: " + error.message;

      return;
    }


    document.getElementById("productMessage").textContent =
      "Product added successfully!";


    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productDescription").value = "";
    document.getElementById("imageUrl").value = "";

  }


  /* LOGOUT */

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminPanel").style.display =
      "none";

    document.getElementById("loginPanel").style.display =
      "block";

  }


  /* CHECK LOGIN */

  async function checkLogin() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {

      showAdminPanel();

    }

  }


  checkLogin();

</script>

</body>
</html>
