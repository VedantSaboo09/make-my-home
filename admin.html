<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Make My Home | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f7f4ef;
  color: #29231f;
  padding: 30px 15px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

.header h1 {
  font-size: 35px;
}

.header p {
  color: #9a7652;
  margin-top: 5px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
  margin-bottom: 25px;
}

.card h2 {
  margin-bottom: 20px;
}

input,
textarea,
select {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  margin-bottom: 18px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 8px;
  padding: 13px 20px;
  cursor: pointer;
  font-weight: bold;
}

.add-btn {
  background: #29231f;
  color: white;
  width: 100%;
}

.add-btn:hover {
  background: #9a7652;
}

.status {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

.product {
  display: flex;
  gap: 20px;
  align-items: center;
  border-top: 1px solid #eee;
  padding: 20px 0;
}

.product img {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 10px;
}

.product-info {
  flex: 1;
}

.product-info h3 {
  margin-bottom: 5px;
}

.product-info p {
  margin: 4px 0;
  color: #666;
}

.delete-btn {
  background: #c0392b;
  color: white;
}

@media (max-width: 600px) {

  .product {
    flex-direction: column;
    align-items: flex-start;
  }

  .product img {
    width: 100%;
    height: 200px;
  }

  .delete-btn {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>MAKE MY HOME</h1>
    <p>innovate and create</p>
  </div>


  <div class="card">

    <h2>Add New Product</h2>

    <label>Product Name</label>
    <input
      type="text"
      id="name"
      placeholder="Example: Premium Bed Cover"
    >

    <label>Price</label>
    <input
      type="number"
      id="price"
      placeholder="Example: 4715"
    >

    <label>Category</label>

    <select id="category">

      <option value="bedcover">
        Bed Cover
      </option>

      <option value="comforter">
        Comforter
      </option>

      <option value="decor">
        Home Decor
      </option>

      <option value="other">
        Other
      </option>

    </select>


    <label>Description</label>

    <textarea
      id="description"
      placeholder="Describe your product..."
    ></textarea>


    <label>Product Photo</label>

    <input
      type="file"
      id="image"
      accept="image/*"
    >


    <button
      class="add-btn"
      onclick="addProduct()"
    >
      Add Product
    </button>

    <div
      class="status"
      id="status"
    ></div>

  </div>


  <div class="card">

    <h2>Your Products</h2>

    <div id="products">
      Loading products...
    </div>

  </div>

</div>


<script>

/* ================================
   SUPABASE CONNECTION
================================ */

const SUPABASE_URL =
"PASTE_YOUR_PROJECT_URL_HERE";

const SUPABASE_KEY =
"PASTE_YOUR_PUBLISHABLE_KEY_HERE";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   ADD PRODUCT
================================ */

async function addProduct() {

  const name =
    document.getElementById("name").value.trim();

  const price =
    document.getElementById("price").value;

  const category =
    document.getElementById("category").value;

  const description =
    document.getElementById("description").value.trim();

  const imageFile =
    document.getElementById("image").files[0];

  const status =
    document.getElementById("status");


  if (!name || !price || !imageFile) {

    status.innerText =
      "Please enter a name, price and photo.";

    return;
  }


  status.innerText =
    "Uploading product...";


  try {

    /* Create unique image filename */

    const fileName =
      Date.now() + "-" +
      imageFile.name.replace(/\s+/g, "-");


    /* Upload image */

    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          fileName,
          imageFile
        );


    if (uploadError) {
      throw uploadError;
    }


    /* Get public image URL */

    const { data: imageData } =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(fileName);


    const imageUrl =
      imageData.publicUrl;


    /* Save product */

    const { error } =
      await supabaseClient
        .from("products")
        .insert({

          name: name,

          price: Number(price),

          category: category,

          description: description,

          image_url: imageUrl,

          stock: true

        });


    if (error) {
      throw error;
    }


    status.innerText =
      "✅ Product added successfully!";


    /* Clear form */

    document.getElementById("name").value = "";

    document.getElementById("price").value = "";

    document.getElementById("description").value = "";

    document.getElementById("image").value = "";


    loadProducts();

  }

  catch (error) {

    console.error(error);

    status.innerText =
      "❌ Error: " + error.message;

  }

}


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts() {

  const container =
    document.getElementById("products");


  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order(
        "id",
        { ascending: false }
      );


  if (error) {

    container.innerHTML =
      "<p>Could not load products.</p>";

    console.error(error);

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>No products added yet.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(product => {

    const div =
      document.createElement("div");

    div.className = "product";


    div.innerHTML = `

      <img
        src="${product.image_url}"
        alt="${product.name}"
      >

      <div class="product-info">

        <h3>${product.name}</h3>

        <p>
          ₹${Number(product.price).toLocaleString("en-IN")}
        </p>

        <p>
          ${product.category}
        </p>

      </div>

      <button
        class="delete-btn"
        onclick="deleteProduct('${product.id}')"
      >
        Delete
      </button>

    `;


    container.appendChild(div);

  });

}


/* ================================
   DELETE PRODUCT
================================ */

async function deleteProduct(id) {

  if (
    !confirm(
      "Are you sure you want to delete this product?"
    )
  ) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "Could not delete product: " +
      error.message
    );

    return;
  }


  loadProducts();

}


/* ================================
   START
================================ */

loadProducts();

</script>

</body>
</html>
